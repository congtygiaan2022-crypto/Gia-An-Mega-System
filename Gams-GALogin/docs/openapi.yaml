openapi: 3.0.3
info:
  title: Gams-GALogin OpenAPI Specs
  description: This API provides endpoints for local automation, chromium browser lifecycle management, profile storage, and proxy validation.
  version: 1.0.1
servers:
  - url: http://localhost:1010
    description: Local Gams-GALogin API server

paths:
  /api/browser_versions:
    get:
      tags:
        - versions
      summary: Lay danh sach phien ban trinh duyet
      responses:
        '200':
          description: Thanh cong
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BrowserVersion'

  /api/groups:
    get:
      tags:
        - groups
      summary: Lay danh sach cac nhom
      responses:
        '200':
          description: Thanh cong
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'

  /api/locations:
    get:
      tags:
        - locations
      summary: Lay danh sach thong tin vi tri dia ly
      responses:
        '200':
          description: Thanh cong
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Location'

  /api/profiles:
    get:
      tags:
        - profiles
      summary: Lay toan bo danh sach browser profiles
      responses:
        '200':
          description: Tra ve danh sach profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Profile'

  /api/profile/{id}:
    get:
      tags:
        - profiles
      summary: Lay chi tiet profile theo ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Chi tiet profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '404':
          description: Khong tim thay profile

  /api/profiles/create:
    post:
      tags:
        - profiles
      summary: Tao moi profile trinh duyet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                group:
                  type: string
                proxy:
                  type: string
                platform:
                  type: string
                  enum: [Windows, macOS, Linux]
                userAgent:
                  type: string
                notes:
                  type: string
      responses:
        '200':
          description: Tao profile thanh cong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'

  /api/profiles/update/{profile_id}:
    post:
      tags:
        - profiles
      summary: Cap nhat thong tin profile
      parameters:
        - name: profile_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                group:
                  type: string
                proxy:
                  type: string
                notes:
                  type: string
      responses:
        '200':
          description: Da cap nhat thanh cong

  /api/profiles/delete/{id}:
    get:
      tags:
        - profiles
      summary: Xoa profile khoi he thong
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Xoa thanh cong

  /api/profiles/start/{id}:
    get:
      tags:
        - profiles
      summary: Khoi chay Chromium cho profile theo ID
      description: Bat trinh duyet len voi user-data-dir cach ly. Tra ve cong go loi debug de Puppeteer/Playwright ket noi.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Mo thanh cong trinh duyet
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  wsUrl:
                    type: string
                    description: Duong dan WebSocket debugger (e.g. ws://127.0.0.1:xxxxx/devtools/browser/...)
                  port:
                    type: integer
                    description: Cong debug remote-debugging-port
                  pid:
                    type: integer
                    description: Process ID cua Chromium

  /api/profiles/close/{id}:
    get:
      tags:
        - profiles
      summary: Dong trinh duyet cua profile theo ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Dong trinh duyet thanh cong

  /api/profiles/check-status/{id}:
    post:
      tags:
        - profiles
      summary: Kiem tra trang thai trinh duyet co dang chay khong
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Chi tiet trang thai
          content:
            application/json:
              schema:
                type: object
                properties:
                  isRunning:
                    type: boolean
                  pid:
                    type: integer

  /api/profiles/changeFingerprint:
    get:
      tags:
        - profiles
      summary: Thay doi van tay tu dong cho profiles duoc chon
      parameters:
        - name: ids
          in: query
          description: Danh sach cac profile ID phan cach bang dau phay
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thanh cong

  /api/profiles/resource/{id}:
    post:
      tags:
        - profiles
      summary: Cap nhat thong so phan cung cho profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cpuCores:
                  type: integer
                memoryGb:
                  type: integer
      responses:
        '200':
          description: Cap nhat thanh cong

  /api/scripts:
    get:
      tags:
        - scripts
      summary: Lay danh sach cac kich ban tu dong hoa co san
      responses:
        '200':
          description: Danh sach kich ban
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string

  /api/scripts/execute/{id}:
    post:
      tags:
        - scripts
      summary: Chay kich ban tu dong hoa theo ID
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - profileId
              properties:
                profileId:
                  type: string
      responses:
        '200':
          description: Kich ban bat dau chay
          content:
            application/json:
              schema:
                type: object
                properties:
                  executionId:
                    type: string
                  status:
                    type: string

  /api/scripts/check-status/{id}:
    post:
      tags:
        - scripts
      summary: Kiem tra trang thai thuc thi cua mot kich ban
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Chi tiet tien trinh

  /api/scripts/kill-execute/{id}:
    post:
      tags:
        - scripts
      summary: Cuong che dung mot kich ban dang chay
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Da kịch ban bi kiet tieu

components:
  schemas:
    BrowserVersion:
      type: object
      properties:
        version:
          type: string
        stable:
          type: boolean

    Group:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    Location:
      type: object
      properties:
        country:
          type: string
        ip:
          type: string

    Profile:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [running, stopped]
        proxy:
          type: string
        browserVersion:
          type: string
        lastOpened:
          type: string
        notes:
          type: string
        group:
          type: string
        cookiesCount:
          type: integer
        platform:
          type: string
        userAgent:
          type: string
