<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Mock BCGame Bet Slip</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #fff; padding: 20px; }
        .match-card { border: 1px solid #333; padding: 15px; margin-bottom: 15px; background: #222; }
        #betby { border: 2px dashed #ffc107; padding: 15px; margin-top: 20px; background: #2b2b2b; }
        .bet-item { border: 1px solid #444; padding: 10px; margin-bottom: 10px; background: #333; position: relative; }
        .close-btn { position: absolute; right: 10px; top: 10px; cursor: pointer; color: red; font-weight: bold; background: none; border: none; }
        input[type="number"] { width: 100px; padding: 5px; font-size: 16px; margin: 10px 0; background: #444; color: #fff; border: 1px solid #555; }
        button.place-bet { background: #28a745; color: white; border: none; padding: 10px 20px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button.clear-all { background: #dc3545; color: white; border: none; padding: 5px 10px; cursor: pointer; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h1>BCGame Mockup Interface</h1>
    
    <div class="match-card">
        <h3>Greuther Furth vs Essen</h3>
        <button id="btn-bet-1">Kèo trên 0.5 (1.28)</button>
    </div>

    <!-- Bet Slip Container -->
    <div id="betby">
        <h2>Bet Slip (Phiếu cược)</h2>
        
        <!-- Simulate "Clear all" button -->
        <button class="clear-all" id="clear-all-btn">Xóa tất cả</button>
        
        <div id="slip-items">
            <!-- Existing bet item (Ma Rốc vs Na Uy - Odds 1.28) -->
            <div class="bet-item" id="bet-item-1">
                <h4>Ma Rốc vs Na Uy</h4>
                <p>Kèo: Tài 0.5 (1.28)</p>
                <button class="close-btn" onclick="document.getElementById('bet-item-1').remove()">X</button>
            </div>
        </div>

        <div>
            <label>Số tiền đặt cược:</label><br>
            <input type="number" id="stake-input" placeholder="0" class="stake-input-class">
        </div>

        <button class="place-bet" id="place-bet-btn">Cược (Place Bet)</button>
    </div>

    <script>
        // Simulate React/Vue state binding on input
        const input = document.getElementById('stake-input');
        input.addEventListener('input', function(e) {
            console.log('React/Vue heard INPUT event! Current Value:', e.target.value);
        });
        input.addEventListener('change', function(e) {
            console.log('React/Vue heard CHANGE event! Current Value:', e.target.value);
        });

        // Simulate Clear All button click
        document.getElementById('clear-all-btn').addEventListener('click', function() {
            document.getElementById('slip-items').innerHTML = '';
            console.log('Cleared all slip items!');
        });
    </script>
</body>
</html>
